# quilt configuration for this store. quilt sources this file in shell syntax:
#
#     quilt --quiltrc=<path to this file> <verb>
#
# Run that from inside a kernel tree and quilt reads the series and the patch
# files from this directory, and writes them back, so a tree needs no copy of
# its own. Naming and numbering rules: README.md.
#
# QUILT_PATCHES defaults to the directory holding this file (quilt exports
# QUILTRC before sourcing it); set it yourself to point somewhere else.
if [ -z "${QUILT_PATCHES:-}" ] && [ -n "${QUILTRC:-}" ] && [ -f "${QUILTRC}" ]
then
	QUILT_PATCHES=$(CDPATH= cd -- "$(dirname -- "$QUILTRC")" && pwd)
fi
export QUILT_PATCHES
export QUILT_PC=.pc
export QUILT_PATCH_OPTS="--fuzz=0"
export QUILT_DIFF_OPTS="-p"
export QUILT_NO_DIFF_INDEX=1
export QUILT_NO_DIFF_TIMESTAMPS=1
export QUILT_REFRESH_ARGS="-p ab --no-index --no-timestamps"
