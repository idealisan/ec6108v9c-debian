name: build-release

on:
  workflow_dispatch:
    inputs:
      archive_refs:
        description: 'Archive third-party reference snapshots (large, ~2GB)'
        type: boolean
        default: false
      fb_base:
        description: 'hiboot framebuffer physical address (hex). Empty keeps HDMI console disabled.'
        type: string
        default: ''
      layout:
        description: 'partition layout: merged (p8 rootfs, default) or community (p9 rootfs, diagnostic)'
        type: choice
        default: merged
        options:
          - merged
          - community
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'configs/**'
      - 'patches/**'
      - 'rootfs/**'
      - '.github/workflows/build-release.yml'

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf u-boot-tools bc bison flex libssl-dev libelf-dev \
            lz4 zstd xz-utils cpio rsync unzip file device-tree-compiler \
            debootstrap qemu-user-static binfmt-support e2fsprogs zip \
            mtools dosfstools parted python3
          sudo apt-get install -y --no-install-recommends libc6:i386 libstdc++6:i386 lib32z1 || true

      - name: Init kernel submodule (shallow, pinned commit)
        run: git submodule update --init --depth 1 third_party/linux-hi3798mv100

      - name: Build mainline 6.x kernel with local patches
        env:
          FB_BASE: ${{ inputs.fb_base }}
          LAYOUT_ENV: ${{ inputs.layout == 'community' && 'configs/partition-layout-community.env' || 'configs/partition-layout.env' }}
        run: bash scripts/build-kernel.sh

      - name: Build Debian rootfs (SSH + telnet + WiFi firmware + tools)
        run: bash scripts/build-rootfs.sh

      - name: Build community-format U-disk flash package
        run: |
          echo "STAMP=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_ENV"
          bash scripts/make-community-flash-package.sh

      - name: Archive reference materials
        # Opt-in only: these snapshots are multi-GB and would show up as
        # oversized assets on every single release.
        if: ${{ inputs.archive_refs == true }}
        run: bash scripts/make-references-archive.sh

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<EOF
          EC6108V9C (Hi3798MV100) Debian armhf - community boot method

          - build (UTC): $STAMP
          - boot/flash: community (ECOO) U-disk method, p1 hiboot NOT written
          - kernel: mainline 6.3.0-rc5 + hi3798mv100 port, with local patches:
              * simple-framebuffer + fbcon (HDMI console, disabled until FB_BASE set)
              * Hi3798MV100 on-chip Tsensor -> /sys/class/thermal/thermal_zone0/temp
              * rtl8xxxu (RTL8188FU USB WiFi, 0bda:f179) built in
              * ext4/f2fs/btrfs/xfs/squashfs/overlay/exfat/ntfs3/fuse built in
          - rootfs: Debian 12 bookworm armhf (debootstrap)
              * SSH enabled (root / ec6108v9c - CHANGE IT), telnet on 23
              * DHCP on eth0 and wlx8421f1edf583, wpasupplicant + firmware-realtek
              * lm-sensors, fbset, kbd, console-setup, full CLI toolset

          Assets:
          - mv100-mdmo1g-debian-usb-flash-$STAMP.zip   U-disk flash package (community layout)
          - hi_kernel.bin        uImage = zImage + DTB, load 0x2000000 -> p6 (LBA 0x7000)
          - zImage-dtb           raw kernel for other boot experiments
          - modules.tar.gz       kernel modules (/lib/modules)
          - debian-rootfs-armhf-bookworm.tar.gz  plain rootfs tarball (not for flashing)
          - patches/kernel/*     kernel patches applied during the build
          - SHA256SUMS.txt

          Flashing:
          1. Format a USB stick FAT32/MBR, extract the flash zip to its root.
          2. Power off, insert stick, power on with the recovery pads shorted
             (same trigger as the community Ubuntu package).
          3. hiboot runs bootargs.bin and writes p6 (kernel), p8 (rootfs sparse)
             and p2 (runtime env), then resets. p1/p3/p4/p5/p7 untouched
             (the 512M backup partition is reclaimed into the rootfs).
          4. First boot: resize2fs grows p9, SSH/telnet come up on DHCP.

          Login: ssh root@<ip> / ec6108v9c, or telnet <ip> (plaintext).
          Serial console ttyAMA0 115200. WiFi: ec6108-wifi <SSID> <password>.
          Temperature: ec6108-temp (or cat /sys/class/thermal/thermal_zone0/temp).
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-$STAMP" \
            --title "$STAMP · debian12-armhf + linux-6.x + community-usb-flash" \
            --notes-file RELEASE_NOTES.md \
            dist/*

  # Boots the Debian armhf rootfs on an emulated ARM board and checks that
  # systemd comes up and SSH is reachable. This is the minimum bar before
  # flashing the real box: if the userspace cannot even boot here, it will
  # not boot there either.
  qemu-boot-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU and helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm sshpass debootstrap qemu-user-static binfmt-support e2fsprogs ca-certificates

      - name: Fetch Debian armhf kernel and boot initramfs
        run: |
          mkdir -p build/qemu/pkg
          cd build/qemu
          # NOTE: the *installer* netboot initrd boots the Debian installer
          # (it asks for a language and never touches our rootfs), so use the
          # kernel package that ships a normal boot initramfs instead.
          URL=$(curl -fsSL http://deb.debian.org/debian/dists/bookworm/main/binary-armhf/Packages.gz                 | gunzip                 | awk '/^Package: linux-image-6\.1\..*-armmp$/{p=1} p && /^Filename: /{print $2; exit}')
          echo "kernel package: $URL"
          test -n "$URL"
          curl -fsSL -o kernel.deb "http://deb.debian.org/debian/$URL"
          dpkg-deb -x kernel.deb pkg
          cp pkg/boot/vmlinuz-* vmlinuz
          cp pkg/boot/initrd.img-* initrd
          ls -l vmlinuz initrd

      - name: Build Debian armhf rootfs
        run: bash scripts/build-rootfs.sh

      - name: Build raw ext4 image for QEMU
        run: |
          sudo truncate -s 1024M build/qemu/rootfs.ext4
          sudo mke2fs -q -F -t ext4 -L debian-root -d build/rootfs build/qemu/rootfs.ext4
          # qemu runs as the normal user and must be able to read the image
          sudo chown "$(id -u):$(id -g)" build/qemu/rootfs.ext4
          chmod 644 build/qemu/rootfs.ext4

      - name: Boot under QEMU and verify SSH
        run: |
          KERNEL=build/qemu/vmlinuz INITRD=build/qemu/initrd ROOTFS=build/qemu/rootfs.ext4 bash scripts/qemu-boot-test.sh

      - name: Upload QEMU console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-console-log
          path: build/qemu-console.log
