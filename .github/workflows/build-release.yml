name: build-release

on:
  workflow_dispatch:
    inputs:
      archive_refs:
        description: 'Archive third-party reference snapshots (large, ~2GB)'
        type: boolean
        default: false
      fb_base:
        description: 'static simplefb address (hex). Leave empty - the driver discovers the hiboot framebuffer at runtime.'
        type: string
        default: ''
      fb_width:
        description: 'framebuffer width, measured on the community system'
        type: string
        default: '1920'
      fb_height:
        description: 'framebuffer height'
        type: string
        default: '1080'
      fb_stride:
        description: 'framebuffer stride in bytes'
        type: string
        default: '7680'
      fb_format:
        description: 'simplefb format string'
        type: string
        default: 'a8r8g8b8'
      fb_size:
        description: 'framebuffer reservation size (hex); covers the double-buffered scan-out region (docs/040)'
        type: string
        default: '0x1000000'
      extra_cmdline:
        description: 'extra kernel params appended to /chosen/bootargs'
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'configs/**'
      - 'patches/**'
      - 'rootfs/**'
      - '.github/workflows/build-release.yml'

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

# The kernel build and the rootfs build are independent (neither reads the
# other's output). They run as parallel jobs and hand their dist/ contents to
# the package job through artifacts - GitHub-internal transfer, no external
# network involved.
jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf u-boot-tools bc bison flex libssl-dev libelf-dev \
            lz4 zstd xz-utils cpio rsync unzip file device-tree-compiler python3

      - name: Init kernel submodule (shallow, pinned commit)
        run: git submodule update --init --depth 1 third_party/linux-hi3798mv100

      - name: Build mainline 6.x kernel with local patches
        env:
          FB_BASE: ${{ inputs.fb_base }}
          LAYOUT_ENV: configs/partition-layout.env
          FB_WIDTH: ${{ inputs.fb_width }}
          FB_HEIGHT: ${{ inputs.fb_height }}
          FB_STRIDE: ${{ inputs.fb_stride }}
          FB_FORMAT: ${{ inputs.fb_format }}
          FB_SIZE: ${{ inputs.fb_size }}
          EXTRA_CMDLINE: ${{ inputs.extra_cmdline }}
        run: bash scripts/build-kernel.sh

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  build-rootfs:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rootfs build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap qemu-user-static binfmt-support python3

      - name: Build Debian rootfs (SSH + telnet + WiFi firmware + tools)
        run: bash scripts/build-rootfs.sh

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  package:
    needs: [build-kernel, build-rootfs]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs zip python3 clang lld mtools dosfstools parted curl git file

      - name: Download kernel artifacts
        uses: actions/download-artifact@v4
        with:
          name: kernel-dist
          path: dist/

      - name: Download rootfs artifact
        uses: actions/download-artifact@v4
        with:
          name: rootfs-dist
          path: dist/

      - name: Build community-format U-disk flash package (legacy fallback)
        run: |
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          STAMP="$STAMP" bash scripts/make-community-flash-package.sh

      - name: Build recovery-flasher mainline U-disk package (recommended)
        # Reuses the mainline kernel/rootfs images built above, but swaps the
        # FLASHER PROGRAM: top-level bootargs.bin becomes a recovery entry
        # (fatload recovery.img; bootm) driven by the patched STOCK recovery
        # 3.10 kernel + our terminal-style flasher (HDMI progress log), which
        # writes p2/p5/p6/p8 by ABSOLUTE LBA from flash.manifest. This is the
        # method already verified on real hardware; no kernel/rootfs rebuild.
        # clang/lld above compile only the 15KB ARM flasher ELF, not a toolchain
        # cross-build, so this adds seconds, not minutes, to the package job.
        run: STAMP="$STAMP" bash scripts/make-recovery-flash-package.sh

      - name: Archive reference materials
        # Opt-in only: these snapshots are multi-GB and would show up as
        # oversized assets on every single release.
        if: ${{ inputs.archive_refs == true }}
        run: bash scripts/make-references-archive.sh

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<EOF
          EC6108V9C (Hi3798MV100) Debian armhf - mainline 6.x

          - build (UTC): $STAMP
          - flash (RECOMMENDED): recovery-flasher - patched STOCK recovery 3.10
            kernel + terminal-style flasher, HDMI progress log, writes by
            absolute LBA from flash.manifest (p2/p5/p6/p8). p1 hiboot NEVER written.
          - legacy fallback: community (ECOO) hiboot mmc-write U-disk package
          - kernel: mainline 6.3.0-rc5 + hi3798mv100 port, with local patches:
              * HDMI console driver hands off the hiboot framebuffer to simplefb/fbcon
              * pstore/ramoops reserved-memory node captures panic logs
              * Hi3798MV100 on-chip Tsensor -> /sys/class/thermal/thermal_zone0/temp
              * rtl8xxxu (RTL8188FU USB WiFi, 0bda:f179) built in
              * ext4/f2fs/btrfs/xfs/squashfs/overlay/exfat/ntfs3/fuse built in
          - rootfs: Debian 12 bookworm armhf (debootstrap)
              * SSH enabled (root / ec6108v9c - CHANGE IT), telnet on 23
              * DHCP on eth0 and wlx8421f1edf583, wpasupplicant + firmware-realtek
              * lm-sensors, fbset, kbd, console-setup, full CLI toolset

          Assets:
          - mv100-mdmo1g-mainline-recovery-flash-$STAMP.zip  ** RECOMMENDED **
            recovery-flasher package: patched stock recovery kernel + terminal
            flasher (HDMI progress log), absolute-LBA flash.manifest.
          - mv100-mdmo1g-debian-usb-flash-$STAMP.zip   legacy community-format
            package (hiboot mmc-write script), kept as a known-good fallback.
          - hi_kernel.bin        uImage = zImage + DTB, load 0x2000000 -> p6 (LBA 0x7000)
          - modules.tar.gz       kernel modules (/lib/modules)
          - debian-rootfs-armhf-bookworm.tar.gz  plain rootfs tarball (not for flashing)
          - patches/kernel/*     kernel patches applied during the build
          - SHA256SUMS.txt

          Flashing (RECOMMENDED recovery-flasher package):
          1. Format a USB stick FAT32/MBR, extract the recommended zip to root.
             KEEP the community fastboot.bin at the U-disk root (BootROM loads
             it on a shorted power-on; this package never writes p1).
          2. Power off, insert stick, power on with the recovery pads shorted.
          3. hiboot reads top-level bootargs.bin -> fatload recovery.img; bootm
             -> patched stock recovery kernel lights HDMI and runs the terminal
             flasher: a scrolling "<number> <TEXT>" log, then writes p2/p5/p6/p8
             by absolute LBA. Stops at "6 DONE NO REBOOT".
          4. Power off, remove stick, boot normally -> mainline 6.x from p6.
             First boot: resize2fs grows p8, SSH/telnet come up on DHCP.

          BOOT DISPLAY (best effort, NOT verified on real HW): the kernel carries
          console=tty0 + fbcon=map:0 + clk_ignore_unused + a simplefb/hdmi-console
          handoff driver + pstore/ramoops. A static simplefb node is intentionally
          omitted (framebuffer base not measured; not guessed). Judge on HW by:
          "Debian Linux" logo (hiboot drew p5) / green band (kernel reached HDMI
          driver) / an IP on the router (network up). If HDMI+SSH both dark,
          pstore/ramoops keeps the panic log. Flash-stage terminal log is verified.

          Login: ssh root@<ip> / ec6108v9c, or telnet <ip> (plaintext).
          Serial console ttyAMA0 115200. WiFi: ec6108-wifi <SSID> <password>.
          Temperature: ec6108-temp (or cat /sys/class/thermal/thermal_zone0/temp).
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-$STAMP" \
            --title "$STAMP · debian12-armhf + linux-6.x + recovery-flasher USB" \
            --notes-file RELEASE_NOTES.md \
            dist/*

  # Boots the Debian armhf rootfs on an emulated ARM board and checks that
  # systemd comes up and SSH is reachable. This is the minimum bar before
  # flashing the real box: if the userspace cannot even boot here, it will
  # not boot there either. Reuses the rootfs artifact instead of rebuilding it.
  qemu-boot-test:
    needs: [build-rootfs]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU and helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm sshpass e2fsprogs ca-certificates cpio curl \
            gzip binutils python3

      - name: Download rootfs artifact
        uses: actions/download-artifact@v4
        with:
          name: rootfs-dist
          path: dist/

      - name: Boot under QEMU and verify SSH
        # Same script as the local test (scripts/qemu-local-test.sh): the
        # rootfs is booted directly as an initramfs, so no disk image and no
        # initrd from the Debian kernel package are needed.
        run: |
          ROOTFS_TAR=dist/debian-rootfs-armhf-bookworm.tar.gz \
          WORK=build/qemu/local \
          CONSOLE_LOG=build/qemu/local-console.log \
            bash scripts/qemu-local-test.sh

      - name: Upload QEMU console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-console-log
          path: build/qemu/local-console.log
